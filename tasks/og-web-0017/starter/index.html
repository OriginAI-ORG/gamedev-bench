<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automatic pickup</title><style>body{margin:0;background:#152833;color:#eff6fb;font:17px system-ui}main{max-width:1000px;margin:24px auto;padding:18px}button{font:inherit;padding:8px;margin:4px}#scene{width:100%;height:360px;background:#304d52;border:2px solid #8eab90;display:block}image{image-rendering:pixelated}#status{padding:16px}</style><main><h1>Automatic pickup</h1><p>Move with Left / Right or the buttons. Touch the pickup to collect it.</p><button id="left">Move left</button><button id="right">Move right</button><button id="decoy">Non-tank contact</button><button id="mute">Mute SFX</button><button id="reset">Reset</button><svg id="scene" viewBox="-80 -90 240 180" aria-label="Tank and pickup"></svg><div id="status">Collected: 0</div></main><script type="module" src="fixture.js"></script></html>

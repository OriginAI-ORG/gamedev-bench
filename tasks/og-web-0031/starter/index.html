<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell portal</title><style>*{box-sizing:border-box}body{margin:0;background:#132c37;color:#edf6fa;font:16px system-ui}main{max-width:1040px;margin:24px auto;padding:20px}button{font:inherit;padding:8px}#scene{position:relative;height:420px;background:repeating-linear-gradient(90deg,#244b59 0 39px,#315b68 40px 41px);border:2px solid #698f9e;touch-action:none}.unit{position:absolute;width:110px;height:72px;transform:translate(-50%,-50%);display:grid;place-items:center;background:#5c7298;border:2px solid #bed3ea;color:#fff;cursor:grab;touch-action:none;user-select:none}.unit:nth-of-type(2){background:#82649e}#dropzone{position:absolute;right:30px;top:70px;width:260px;height:280px;display:grid;place-items:center;background:#22334f;border-radius:50%;border:3px solid #9b88cf}#portal-sprite{width:100px;height:110px}#preview{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:28px;color:#f5d16c}#status{padding:12px;background:#1d3947}[hidden]{display:none!important}</style><main><h1>Sell portal</h1><p>Drag a unit into the portal. Release or press S while overlapping to sell it.</p><button id="reset">Reset</button><div id="scene"><div id="dropzone"><svg id="portal-sprite" viewBox="0 0 100 110" aria-label="Portal creature"><path fill="#a391d6" d="M20 35L0 50 20 65V95h60V25L60 5 50 30z"/><path fill="#f8db7e" d="M20 38h12v12H20z"/><path fill="#342948" d="M8 53h32v7H8z"/></svg><div id="preview" hidden></div></div><div id="units"></div></div><div id="status">Gold: <span id="gold">0</span> · Units: <span id="count">2</span><p>Returned resources: <span id="pool"></span></p></div></main><script type="module" src="fixture.js"></script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finite state machine</title><style>*{box-sizing:border-box}body{background:#142c36;color:#eaf6fb;font:16px system-ui;margin:0}main{max-width:900px;margin:24px auto;padding:20px}button{font:inherit;padding:8px;margin:4px}#scene{position:relative;height:280px;background:repeating-linear-gradient(90deg,#244b58 0 39px,#315c6b 40px 41px);border:2px solid #638e9d}#actor{position:absolute;left:45%;top:38%;width:60px;height:90px;background:#62bde7;border-radius:20px 20px 8px 8px;transform-origin:bottom}#actor:before{content:'';position:absolute;top:20px;left:12px;width:8px;height:8px;background:#11242e;box-shadow:28px 0 #11242e}#actor[data-pose=RUN]{transform:rotate(20deg) translateX(40px);background:#70e4ab}#actor[data-pose=ATTACK]{transform:scaleX(1.4) rotate(-10deg);background:#f6b760}#status{font-size:24px;padding:12px}#log{padding:14px;background:#0d202b;min-height:120px}</style><main><h1>Finite state machine</h1><button id="state-IDLE">Idle</button><button id="state-RUN">Run</button><button id="state-ATTACK">Attack</button><button id="reset">Reset</button><div id="scene"><div id="actor" data-pose="IDLE"></div></div><div id="status">IDLE</div><pre id="log"></pre></main><script type="module" src="fixture.js"></script></html>

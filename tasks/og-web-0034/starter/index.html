<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Directional sprite configuration</title><style>body{margin:0;background:#152a35;color:#edf7ff;font:17px system-ui}main{max-width:1000px;margin:20px auto;padding:18px}button{font:inherit;padding:8px;margin:4px}#scene{display:grid;place-content:center;position:relative;height:340px;background:#213e4a;border:2px solid #809ba8}#sprite{width:128px;height:128px;image-rendering:pixelated}#collider{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px dashed #e3ca65;pointer-events:none;box-sizing:border-box}#status,#hit{padding:10px}</style><main><h1>Directional sprite configuration</h1><p>Inspect the supplied sheet, assign movement frames and test an area ray.</p><button id="up">Up</button><button id="down">Down</button><button id="left">Left</button><button id="right">Right</button><button id="pause">Pause / Play</button><button id="step">Advance 0.1 s</button><button id="probe">Probe area</button><button id="reset">Reset</button><div id="scene"><canvas id="sprite" width="128" height="128"></canvas><div id="collider"></div></div><div id="status"></div><div id="hit">No probe</div></main><script type="module" src="fixture.js"></script></html>

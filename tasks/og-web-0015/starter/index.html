<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card pile utilities</title><style>*{box-sizing:border-box}body{margin:0;background:#172938;color:#f1f4fb;font:16px system-ui}main{max-width:1000px;margin:24px auto;padding:20px}button,input{font:inherit;padding:8px;margin:4px}input{width:130px}#scene{padding:24px;min-height:360px;background:#223c50;border:2px solid #6a90a6}#pile{display:flex;gap:16px;min-height:120px;flex-wrap:wrap}.card{display:grid;place-items:center;width:100px;height:120px;border:3px solid #f6cf82;background:linear-gradient(135deg,#294f69,#436f92);border-radius:8px}.cost{color:#f6cf82}pre{padding:14px;background:#11202e;min-height:50px}#drawn{padding:12px;color:#f6cf82}</style><main><h1>Card pile utilities</h1><button id="draw">Draw</button><label>Card <input id="card-id" value="bash"></label><label>Cost <input id="card-cost" type="number" value="2"></label><button id="add">Add card</button><button id="shuffle">Shuffle</button><button id="clear">Clear</button><button id="reset">Reset</button><section id="scene"><div id="pile"></div><div id="drawn">—</div><p>Cards: <span id="count">3</span></p><pre id="listing"></pre></section><p>Size events</p><pre id="events"></pre></main><script type="module" src="fixture.js"></script></html>

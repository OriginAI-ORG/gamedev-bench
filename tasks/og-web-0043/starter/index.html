<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flight HUD workshop</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111e30;color:#f0f5fc;font:16px system-ui}main{max-width:1000px;margin:auto;padding:24px}button{font:inherit;padding:10px 14px;border:1px solid #6484a7;border-radius:6px;background:#243f60;color:white;margin:4px}button:focus-visible{outline:3px solid #ffd36b}.toolbar{display:flex;flex-wrap:wrap;margin:14px 0}#scene{position:relative;width:100%;height:460px;overflow:hidden;background:#183b50}#world{position:absolute;inset:0;background:repeating-linear-gradient(110deg,transparent 0 75px,#264b55 76px 110px,transparent 111px 160px)}#ship{position:absolute;left:45%;top:38%;font-size:64px;color:#e6bd63}#ui-layer{position:absolute;inset:0;pointer-events:none}#ui-layer button{pointer-events:auto}[hidden]{display:none!important}#notice{min-height:24px;color:#ffd36b}h1{font-size:26px}</style>
<main><h1 id="title">Flight HUD workshop</h1><p>Keep the instruments attached to the screen while the world moves.</p><div class="toolbar"><button id="hit">Hit target</button><button id="damage">Take damage</button><button id="pan">Pan world</button><button id="grow">Increase panel minimum</button><button id="reset">Reset</button></div><div id="scene"><div id="world"><span id="ship">✈</span></div><div id="ui-layer"></div></div><p id="notice" role="status"></p><output id="status">playing</output></main><script type="module" src="fixture.js"></script></html>

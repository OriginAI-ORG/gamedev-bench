<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nearest item interaction</title><style>body{margin:0;background:#132332;color:#eff8ff;font:17px system-ui}main{max-width:1000px;margin:20px auto;padding:18px}button{font:inherit;margin:4px;padding:8px}canvas{display:block;width:100%;height:420px;border:2px solid #6d90ac}#items{display:flex;gap:20px;padding:14px}.focused{outline:2px solid #bceaff}#bag,#position{padding:10px}</style><main><h1>Nearest item interaction</h1><p>Move with the controls or arrow keys. Press F to pick up the nearest highlighted item.</p><button id="left">Left</button><button id="right">Right</button><button id="forward">Forward</button><button id="back">Back</button><button id="reset">Reset</button><canvas id="scene" width="960" height="420" aria-label="Three-dimensional cube and sphere"></canvas><div id="position"></div><div id="items"></div><div>Collected: <span id="bag"></span></div></main><script type="module" src="fixture.js"></script></html>

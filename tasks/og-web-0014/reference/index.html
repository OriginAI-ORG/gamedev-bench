<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit AI debug label</title><style>*{box-sizing:border-box}body{margin:0;background:#142230;color:#eef7fa;font:16px system-ui}main{max-width:900px;margin:24px auto;padding:20px}button{font:inherit;margin:4px;padding:8px}#scene{height:400px;position:relative;background:repeating-linear-gradient(0deg,#203d4b 0 39px,#315462 40px 41px);border:2px solid #698998}#actor{position:absolute;left:50%;top:55%;width:0;height:0}#sprite{position:absolute;left:-18px;top:-20px;width:36px;height:40px;background:#edb25b;clip-path:polygon(25% 0,75% 0,100% 40%,80% 70%,80% 100%,20% 100%,20% 70%,0 40%)}#debug-label{background:#132c3b;color:#9ef4dd;font:14px monospace;white-space:nowrap}#status{padding:12px}[hidden]{display:none!important}</style><main><h1>Unit AI debug label</h1><p>Inspect a reusable controller attached to its own actor and label.</p><button id="patrol">Patrol</button><button id="attack">Attack</button><button id="stop">Idle</button><button id="toggle">Toggle debug</button><button id="move">Move actor</button><button id="reset">Reset</button><div id="scene"></div><div id="status">Ready</div></main><script type="module" src="fixture.js"></script></html>

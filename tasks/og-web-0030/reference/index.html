<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trait tracker</title><style>*{box-sizing:border-box}body{background:#152c39;color:#eaf6fb;font:16px system-ui;margin:0}main{max-width:1020px;margin:24px auto;padding:20px}button,select{font:inherit;padding:8px;margin:4px}#scene{position:relative;min-height:360px;background:#29485b;padding:20px;border:2px solid #6d91a6}#trait-host{width:220px;float:left}#trait{padding:16px;background:#142c3d;border:2px solid #6684a0}#trait-top{display:flex;gap:12px;align-items:center}#icon-background{padding:8px;background:#243c50}#trait-icon{width:32px;height:32px;image-rendering:pixelated}#active-units{font-size:26px}#trait-name{margin-top:16px}#levels{color:#ecf4fa}#units{margin-left:245px;display:flex;flex-wrap:wrap;gap:12px}.unit{display:grid;place-items:center;width:110px;height:100px;background:#456b7d;color:#fff;border:2px solid #a9c5cb;cursor:pointer}@media(max-width:650px){#trait-host{float:none}#units{margin:20px 0 0}}</style><main><h1>Trait tracker</h1><button id="add-Archer">Add Archer</button><button id="add-Marksman">Add Marksman</button><button id="add-Orc">Add Orc</button><select id="unit-choice" aria-label="Unit"><option>Scout</option><option>Healer</option><option>Guard</option><option>Ranger</option><option>Mage</option></select><button id="add-unit">Add selected unit</button><select id="trait-choice" aria-label="Trait"><option value="elf">elf</option><option value="mage">Mage Guild</option></select><button id="reset">Reset</button><section id="scene"><div id="trait-host"></div><div id="units"></div></section></main><script type="module" src="fixture.js"></script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reusable pickup highlight</title><style>*{box-sizing:border-box}body{background:#12232e;color:#ecf5fa;font:16px system-ui;margin:0}main{max-width:1000px;margin:24px auto;padding:20px}button,select{font:inherit;padding:8px;margin:4px}#scene{display:block;width:100%;height:400px;border:2px solid #698898;outline:none}#status,#metadata{padding:12px;background:#1d3544}#contact{color:#ffcc70}</style><main><h1>Reusable pickup highlight</h1><p>Point at the cube or focus the canvas with the keyboard to inspect its emissive outline.</p><button id="rotate">Rotate view</button><button id="light">Toggle light</button><label>Probe category <select id="category"><option value="1">Player (1)</option><option value="2">Pickup (2)</option><option value="4">Effect (4)</option></select></label><button id="probe">Probe center</button><button id="reset">Reset</button><canvas id="scene" width="800" height="400" tabindex="0" aria-label="Interactive three-dimensional pickup"></canvas><div id="metadata"></div><div id="status">Unfocused</div><div id="contact">No probe</div></main><script type="module" src="fixture.js"></script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player damage event bridge</title><style>*{box-sizing:border-box}body{margin:0;background:#152c39;color:#eaf4fb;font:16px system-ui}main{max-width:900px;margin:24px auto;padding:20px}button{font:inherit;padding:8px;margin:4px}#scene{position:relative;height:340px;background:repeating-linear-gradient(0deg,#244859 0 39px,#315e6d 40px 41px);border:2px solid #7a9ba9;overflow:hidden}#world{position:absolute;inset:0}#actor{position:absolute;left:160px;top:140px;width:70px;height:90px;background:#78b5e1;border:3px solid #c3e2f5;border-radius:18px 18px 5px 5px;cursor:pointer}#actor.hit{background:#ed777c}#hud-host{position:absolute;inset:0;pointer-events:none}#damage-label{position:absolute;left:16px;top:16px;padding:10px;background:#152f40;font-size:22px}</style><main><h1>Player damage event bridge</h1><p>Click the actor or send damage from another source. Both use the same player event.</p><button id="external">External damage</button><button id="pan">Pan world</button><button id="reset">Reset</button><div id="scene"><div id="world"><button id="actor" aria-label="Damage player">Hit</button></div><div id="hud-host"></div></div></main><script type="module" src="fixture.js"></script></html>

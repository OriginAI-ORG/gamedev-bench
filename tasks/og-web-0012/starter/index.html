<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projectile workshop</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b2d;color:#eef4ff;font:16px system-ui}main{max-width:920px;margin:auto;padding:24px}button,select{font:inherit;background:#203952;color:inherit;border:1px solid #7798b9;border-radius:6px;padding:9px;margin:4px}button:focus-visible,select:focus-visible{outline:3px solid #ffd166}.toolbar{display:flex;flex-wrap:wrap;gap:8px}#scene{position:relative;width:800px;height:420px;max-width:100%;overflow:hidden;background:repeating-linear-gradient(0deg,#15273a 0 39px,#1d3349 40px),#15273a;border:2px solid #7494af}#world{position:absolute;width:800px;height:420px;transform-origin:top left}.shot{position:absolute;image-rendering:pixelated}.target{position:absolute;left:350px;top:190px;width:40px;height:40px;border:2px solid #f3c969;background:#8d543b;display:grid;place-content:center;font-size:12px}.tank{position:absolute;left:56px;top:192px;width:40px;height:36px;background:#72b599;border:4px solid #315e4e;border-radius:9px}.tank:after{content:'';position:absolute;width:32px;height:8px;left:24px;top:10px;background:#9cdbc3}.dashboard{display:flex;gap:24px;flex-wrap:wrap;margin:16px 0;padding:16px;background:#1b3047;border-radius:8px}#event-log{max-height:110px;overflow:auto;font:13px monospace}h1{font-size:26px}#notice{color:#ffd166}
</style>
<main><h1 id="title">Projectile workshop</h1><p>Fire across the training range. Change the target and aim to inspect the projectile's behavior.</p>
<div class="toolbar"><button id="fire">Fire</button><label>Aim <select id="aim"><option value="right">Right</option><option value="diagonal">Diagonal</option><option value="left">Left</option><option value="up">Up</option><option value="down">Down</option><option value="zero">Stationary</option></select></label><label>Target <select id="target-kind"></select></label><label>Tank <select id="tank"><option value="alpha">Alpha</option><option value="bravo">Bravo</option></select></label><button id="pause">Pause</button><button id="reset">Reset</button></div>
<div class="dashboard"><span>Shots: <output id="shots">0</output></span><span id="quest-panel">Shoot Em Up: <output id="quest-progress">0</output> / 3 kills · Supply Run: <output id="supply-progress">0</output> / 2 items</span><span>Last owner: <output id="owner">—</output></span></div>
<div id="scene" aria-label="Training range"><div id="world"><div class="tank"></div></div></div><p id="notice" role="status"></p><ol id="event-log"></ol></main>
<script type="module" src="fixture.js"></script></html>

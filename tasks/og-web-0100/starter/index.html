<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battle result panel</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10202c;color:#e8f4fa;font:16px system-ui}main{max-width:1040px;margin:24px auto;padding:16px}h1{font-size:24px}button,input,select{font:inherit;padding:7px;margin:3px}button{cursor:pointer}#scene{position:relative;height:420px;overflow:hidden;background:repeating-linear-gradient(90deg,#234657 0 39px,#315363 40px 41px);border:2px solid #668a9b}#actor{position:absolute;left:24px;top:220px;width:40px;height:40px;background:#fcbd57;clip-path:polygon(0 20%,60% 20%,60% 0,100% 50%,60% 100%,60% 80%,0 80%)}#ui-layer{position:absolute;inset:0;pointer-events:none}#ui-layer>*{pointer-events:auto}#telemetry{padding:12px;background:#172c39}#events{min-height:24px}#status{font-weight:700;color:#fcbd57}[hidden]{display:none!important}</style>
<main><h1 id="title">Battle result panel</h1><p>Complete an encounter, then continue or restart from its result screen.</p>
<div><button id="win">Win encounter</button><button id="lose">Lose encounter</button><label>Message <input id="message" value="External result"></label><select id="outcome" aria-label="Outcome"><option value="0">Win</option><option value="1">Lose</option></select><button id="request">Send result event</button><button id="reset">Reset fixture</button></div>
<div id="scene"><div id="actor"></div><div id="ui-layer"></div></div>
<div id="telemetry">State: <span id="status">running</span> · Elapsed: <span id="elapsed">0</span> · Restarts: <span id="restarts">0</span> · Finishes: <span id="finishes">0</span></div><div id="events" aria-live="polite"></div></main><script type="module" src="fixture.js"></script></html>

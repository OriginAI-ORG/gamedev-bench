<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battle targeting</title><link rel="stylesheet" href="style.css"><main><h1>Battle targeting</h1><p>Select a unit and use arrow keys to move it. The ring shows overlap detection; the line shows the closest opposing target.</p><section id="stage"><svg id="scene" viewBox="-180 -180 800 360" aria-label="Battle units and detection range"></svg></section><nav><label>Attack range <select id="range"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><button id="closer">Bring far unit closer</button><button id="outside">Move enemies outside</button><button id="remove">Remove enemies</button><button id="reset">Reset</button></nav><p id="status">Loading</p><ol id="events" aria-label="Range changes"></ol></main><script type="module" src="fixture.js"></script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draggable decoration</title><style>*{box-sizing:border-box}body{background:#172e39;color:#e9f5fb;font:16px system-ui;margin:0}main{width:1100px;max-width:100%;margin:20px auto;padding:20px}button{font:inherit;padding:8px;margin:4px}#scene{box-sizing:content-box;position:relative;width:1024px;height:520px;background:repeating-linear-gradient(90deg,#254a58 0 39px,#355d6d 40px 41px);border:2px solid #7197a5;touch-action:none;overflow:hidden}.target{position:absolute;top:156px;width:120px;height:48px;border:2px dashed #75e8b9;text-align:center;padding-top:10px;background:#285c54}#dropzone{left:452px}#decoy{left:740px;border-color:#e1a46e;background:#664b3b}.draggable{position:absolute;width:72px;height:72px;transform-origin:center;cursor:grab;touch-action:none;user-select:none}.decoration{position:absolute;width:128px;height:128px;left:-28px;top:-28px;transform:scale(.58);pointer-events:none}#status,#drop-log{padding:12px;background:#1c3846}</style><main><h1>Draggable decoration</h1><p>Drag the star to the green region. Invalid drops shrink away. Escape cancels a drag.</p><button id="reset">Reset</button><div id="scene"><div id="dropzone" class="target">DropTarget · 2</div><div id="decoy" class="target">Filtered · 4</div></div><div id="status">Live decorations: <span id="count">1</span></div><div id="drop-log"></div></main><script type="module" src="fixture.js"></script></html>

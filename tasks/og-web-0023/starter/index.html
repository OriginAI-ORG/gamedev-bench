<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menus and level cameras</title><style>*{box-sizing:border-box}body{margin:0;background:#13232f;color:#f4f7ff;font:16px system-ui}#scene{position:fixed;inset:0;width:100%;height:100%;background:#183448}.menu-panel{background:#25404eed;border:2px solid #89b8c6;box-shadow:0 8px 28px #0006}.menu-panel h2{font-size:30px;margin:0;text-align:center}.menu-panel p{font-size:20px;text-align:center;margin:0}.menu-panel button{background:#dceaf0;color:#153441;border:2px solid #98b7c6;font-family:inherit;min-height:44px;cursor:pointer}.toolbar{position:fixed;bottom:10px;left:10px;z-index:3;background:#10212fe6;padding:8px}.toolbar button{padding:8px;margin:3px}#status{display:inline-block;min-width:190px}#closed{position:fixed;inset:0;background:#172c3c;place-content:center;text-align:center;font-size:32px;z-index:4}#closed:not([hidden]){display:grid}</style><svg id="scene" viewBox="0 0 1000 600" aria-label="Projected level landmarks"></svg><div class="toolbar"><span id="status"></span><button id="pause">Pause</button><button id="death">Show death</button><button id="reset">Reset</button></div><div id="closed" hidden>Session ended</div><script type="module" src="fixture.js"></script></html>

name: 任务与评分建议
description: 提出任务、评分或功能改进
title: "[建议] "
body:
  - type: input
    id: scope
    attributes:
      label: 涉及的任务与版本
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题与改进方案
      description: 请说明需求，并举例说明为何需要改进。
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: 验收与分数可比性
      description: 请说明参考行为、需要拒绝的错误实现，以及改动是否会使旧分数失效。
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: 来源与授权
      description: 新增代码或媒体时，请提供作者、原始网址、确切许可及再分发授权证据。不涉及第三方材料时请注明“无”。
    validations:
      required: true

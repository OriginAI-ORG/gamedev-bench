name: 许可与署名
description: 补充素材授权证据或报告署名遗漏
title: "[授权] "
body:
  - type: input
    id: asset
    attributes:
      label: 文件路径或 SHA-256 哈希
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 原始来源及许可证据
      description: 请提供作者公开声明、原始许可文件及对应素材版本的链接。请勿公开保密协议或个人联系方式。
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: 建议修正
    validations:
      required: true

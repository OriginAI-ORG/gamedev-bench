<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stats overlay</title><link rel="stylesheet" href="theme.css"><style>*{box-sizing:border-box}body{margin:0;background:#152936;color:#eaf6fb;font:16px system-ui}main{max-width:900px;margin:24px auto;padding:20px}button,input{font:inherit;padding:8px;margin:4px}input{width:80px}#scene{position:relative;height:320px;background:radial-gradient(ellipse at center,#375e73,#203b50);border:2px solid #6a8ca0}#actor{position:absolute;left:calc(50% - 24px);top:calc(50% + 30px);width:48px;height:70px;background:#7ab6df;border-radius:20px 20px 5px 5px}#ui-layer{position:absolute;inset:0}[hidden]{display:none!important}</style><main><h1>Stats overlay</h1><p>Change the supplied data and inspect the centered icon-and-number component.</p><label>Block <input id="block-input" type="number" min="0" value="4"></label><label>Health <input id="health-input" type="number" min="0" value="10"></label><button id="apply">Apply stats</button><button id="zero-block">Zero block</button><button id="zero-health">Zero health</button><button id="reset">Reset</button><div id="scene"><div id="actor"></div><div id="ui-layer"></div></div></main><script type="module" src="fixture.js"></script></html>

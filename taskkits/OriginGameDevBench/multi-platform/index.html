<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Multi-tile platform</title><link rel="stylesheet" href="style.css"><main><h1>Multi-tile platform</h1><p>Edit length while paused or moving. Click a tile to place the rider; click empty space to detach.</p><canvas id="scene" width="640" height="320" aria-label="Platform and rider"></canvas><div><label>Length <input id="length" type="number" min="1" max="5" step="1" value="1"></label><label>Offset X <input id="offset-x" type="number" value="16"></label><label>Offset Y <input id="offset-y" type="number" value="0"></label></div><div><button id="play">Play</button><button id="step">Step 0.25 s</button><button id="reset">Reset</button></div><output id="status">Loading</output></main><script type="module" src="fixture.js"></script></html>

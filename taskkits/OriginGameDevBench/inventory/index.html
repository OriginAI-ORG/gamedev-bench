<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory resources</title><style>*{box-sizing:border-box}body{margin:0;background:#182b39;color:#e9f3fa;font:16px system-ui}main{max-width:900px;margin:24px auto;padding:20px}button{font:inherit;padding:8px;margin:4px}#scene{padding:24px;min-height:300px;background:#27485d;border:2px solid #66899c}#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.slot{position:relative;display:grid;place-items:center;min-height:100px;background:#193446;color:#dceffc;border:2px solid #6c8fa7;cursor:pointer}.slot img{width:48px;height:48px;image-rendering:pixelated}.quantity{position:absolute;right:10px;bottom:6px;font-weight:bold}.empty{color:#9bb7c9}</style><main><h1>Inventory resources</h1><p>Add items to the first empty slot. Click an occupied slot to make a hole.</p><button id="add">Add item</button><button id="clear">Clear items</button><button id="reset">Reset</button><div id="scene"><div id="grid"></div><p>Stored items: <span id="count">0</span></p></div></main><script type="module" src="fixture.js"></script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flashlight anchors</title><style>*{box-sizing:border-box}body{background:#122531;color:#e9f3fa;font:16px system-ui;margin:0}main{max-width:1000px;margin:24px auto;padding:20px}button{font:inherit;padding:8px;margin:4px}#scene{display:block;width:100%;height:400px;background:#1e3546;border:2px solid #617f94}#scene text{font:13px monospace;fill:#fff}.point{fill:#ffca64;stroke:#fff;stroke-width:2}.point.targeted{fill:#70f5c4;stroke:#70f5c4}#list{display:flex;gap:16px;flex-wrap:wrap;padding:16px;background:#1b3040}.entry{border-left:3px solid #ffca64;padding:8px}#status{padding:12px}</style><main><h1 id="title">Flashlight anchors</h1><p>Anchors are projected from their three-dimensional world positions.</p><button id="target">Target next point</button><button id="move">Move scene</button><button id="camera">Move camera</button><button id="reset-targets">Reset target states</button><button id="reset">Reset fixture</button><svg id="scene" viewBox="0 0 800 400" role="img" aria-label="Projected flashlight points"></svg><div id="list"></div><div id="status">No target</div></main><script type="module" src="fixture.js"></script></html>
